<!-- 預覽頁面頭部 -->
<header class="preview-header">
  <div class="preview-header-content">
    <h1 class="preview-title">
      <i class="fas fa-eye"></i>
      輪播圖預覽效果
    </h1>
    <div class="preview-actions">
      <div class="device-selector">
        <button
          *ngFor="let d of devices"
          type="button"
          class="device-option"
          [class.active]="currentDevice === d.key"
          (click)="setDevice(d.key)"
        >
          <i class="fas" [ngClass]="d.icon"></i> {{ d.label }}
        </button>
      </div>
      <button type="button" class="close-btn" (click)="Close()">
        <i class="fas fa-times"></i> 關閉預覽
      </button>
    </div>
  </div>
</header>

<div class="preview-home-container">
  <div class="preview-notice">
    <i class="fas fa-info-circle"></i>
    <div>
      <strong>預覽說明：</strong>
      使用官網目前的樣式顯示首頁主視覺。輪播框是 16:10，圖片會裁切填滿，請確認重點沒有被切掉。
      輪播只顯示圖片；<strong>標題不會出現在畫面上</strong>，只作為圖片替代文字給搜尋引擎與螢幕閱讀器。
      有設定連結時，訪客點圖片會在新分頁開啟該網址。
    </div>
  </div>

  <!-- 寬度量測用:iframe 以裝置寬度渲染,再等比縮到這個區塊的寬度 -->
  <div class="preview-stage" #stage>
    <div
      class="preview-scaler"
      [style.width.px]="frameWidth * scale"
      [style.height.px]="frameHeight * scale"
    >
      <iframe
        #frame
        class="preview-frame"
        title="首頁主視覺預覽"
        [srcdoc]="srcdoc"
        [style.width.px]="frameWidth"
        [style.height.px]="frameHeight"
        [style.transform]="'scale(' + scale + ')'"
        (load)="onFrameLoad()"
      ></iframe>
    </div>
  </div>
  <p class="preview-size">預覽寬度 {{ frameWidth }}px{{ scale < 1 ? '（已縮小顯示）' : '' }}</p>
</div>
