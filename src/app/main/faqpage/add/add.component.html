<div class="admin-container">
  <!-- 主要內容 -->
  <main class="admin-content">
    <!-- 表單容器 -->
    <div class="form-container">
      <form id="faqForm">
        <!-- 基本資訊 -->
        <div class="form-section">
          <h2 class="section-title">
            <i class="fas fa-info-circle"></i>
            常見問題資訊
          </h2>

          <div class="form-row">
            <div class="form-group col-12">
              <label for="faqQuestion">
                問題標題 <span class="required">*</span>
              </label>
              <input
                type="text"
                id="faqQuestion"
                name="question"
                placeholder="請輸入常見問題"
                [(ngModel)]="uploadata.question"
                required
              />
              <div class="form-help">問題將顯示在列表頁面與前台 FAQ 區塊</div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-4">
              <label for="displayStatus">顯示狀態</label>
              <div class="status-toggle" (click)="uploadata.status = !uploadata.status">
                <div class="toggle-switch" [ngClass]="{'active': uploadata.status}" id="statusToggle">
                  <div class="toggle-slider"></div>
                </div>
                <span class="status-label" [ngClass]="{'active': uploadata.status}" id="statusLabel">
                  {{ uploadata.status ? '顯示' : '隱藏' }}
                </span>
              </div>
              <div class="form-help">控制問題是否在前台顯示</div>
            </div>

            <div class="form-group col-4">
              <label>圖片素材</label>
              <button type="button" class="btn" (click)="OpenModal()">
                <i>📝</i> 開啟圖片選擇彈窗
              </button>
            </div>
          </div>
        </div>

        <!-- 內容編輯區域 -->
        <div class="form-section">
          <h2 class="section-title">
            <i class="fas fa-edit"></i>
            回答內容
          </h2>

          <div class="form-group">
            <app-editor
              [(ngModel)]="uploadata.answer"
              [ngModelOptions]="{standalone: true}"
            ></app-editor>

            <div class="form-help">
              使用富文本編輯器編寫回答內容，支援圖片、表格、列表等多種格式
            </div>
          </div>
        </div>

        <!-- 表單操作按鈕 -->
        <div class="form-actions">
          <button type="button" class="btn btn-outline" (click)="Cancel()">
            <i class="fas fa-times"></i>
            取消
          </button>
          <button type="submit" class="btn btn-success" (click)="SaveDraft()">
            <i class="fas fa-check"></i>
            儲存
          </button>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- 彈窗 -->
<div id="myModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>圖片選擇器</h3>
      <button class="close-btn" (click)="CloseModal()">&times;</button>
    </div>
    <div class="modal-body">
      <app-picture-manage
        (imageUrlResult)="GetImageUrl($event)"
      ></app-picture-manage>
    </div>
  </div>
</div>
<app-loading *ngIf="isFinish"></app-loading>
