<!-- 沒有待送出的變更時整塊不顯示,避免變成永遠亮著的裝飾 -->
<div class="pending-sort" *ngIf="hasPending">
  <span class="pending-sort-hint">已儲存,尚未更新到官網</span>
  <button
    type="button"
    class="pending-sort-btn"
    [disabled]="isPublishing"
    (click)="publish()"
  >
    <i class="fas" [ngClass]="isPublishing ? 'fa-circle-notch fa-spin' : 'fa-cloud-upload-alt'"></i>
    {{ isPublishing ? '送出中…' : '送出並更新官網' }}
  </button>
</div>
