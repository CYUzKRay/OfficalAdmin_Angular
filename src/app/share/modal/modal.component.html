<div class="modal" [style.display]="isOpen ? 'flex' : 'none'">
  <div class="modal-content">
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
