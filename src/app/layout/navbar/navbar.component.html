<header class="admin-header">
  <div class="logo-container">
    <div class="admin-logo">航泰</div>
    <h1>航泰砂布有限公司 後台管理系統</h1>
  </div>
  <div class="admin-nav">

    <!-- 整站重新發布。存檔後本來就會自動發布,這顆是給「改了模板/樣式」或
         自動發布失敗時人工重來用的 —— 也就是計畫裡說的人工復原手段。 -->
    <div class="publish-box" [title]="publishTooltip">
      <button
        type="button"
        class="publish-btn"
        [class.is-busy]="isPublishing"
        [class.has-pending]="hasPendingChanges && !isPublishing"
        [disabled]="isPublishing"
        (click)="publishSite()"
      >
        <i class="fas" [ngClass]="isPublishing ? 'fa-circle-notch fa-spin' : 'fa-cloud-upload-alt'"></i>
        {{ publishLabel }}
      </button>
      <!-- 狀態小字本身就是展開發布紀錄的入口:操作者想知道「線上這版多久以前發的」時,
           下一個問題通常是「那再之前呢」,放在同一個地方最順 -->
      <button
        type="button"
        class="publish-hint"
        [class.is-problem]="hasPublishProblem"
        [class.is-pending]="hasPendingChanges && !isPublishing"
        *ngIf="publishHint"
        (click)="toggleHistory()"
      >
        {{ publishHint }}
        <i class="fas" [ngClass]="isHistoryOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
      </button>

      <div class="publish-history" *ngIf="isHistoryOpen">
        <div class="publish-history-head">發布紀錄</div>

        <div class="publish-history-empty" *ngIf="isHistoryLoading">載入中…</div>
        <div class="publish-history-empty" *ngIf="!isHistoryLoading && history.length === 0">
          尚無發布紀錄
        </div>

        <div class="publish-history-row" *ngFor="let item of history">
          <span class="ph-dot" [class.is-failed]="!item.isSuccess"></span>
          <div class="ph-main">
            <div class="ph-time">
              {{ formatTime(item.finishedAt || item.startedAt) }}
              <span class="ph-trigger" *ngIf="item.trigger">{{ item.trigger }}</span>
            </div>
            <div class="ph-detail">{{ historyLine(item) }}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="admin-user" (click)="toggleUserDropdown()">
      <div class="admin-avatar">管</div>
      <span>管理員</span>
      <i class="fas fa-chevron-down"></i>
      <div class="user-dropdown" id="userDropdown" [style.display]="isDropdownOpen ? 'block' : 'none'">
        <a href="javascript:void(0)" class="dropdown-item" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i>
          登出
        </a>
      </div>
    </div>
  </div>
</header>
