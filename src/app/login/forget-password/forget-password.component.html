<div class="form-box">
  <div class="brand-logo">
    <span class="logo-icon">💠</span>
    <span>系統管理後台</span>
  </div>
  <h2>忘記密碼</h2>
  <p class="subtitle">請輸入您的電子信箱，我們將寄送重置密碼連結給您</p>

  <form (ngSubmit)="SendResetLink()" #forgetForm="ngForm" class="auth-form">
    <div class="input-group" style="margin-bottom: 30px;">
      <input
        type="email"
        placeholder="電子信箱"
        required
        [(ngModel)]="email"
        name="email"
        class="glass-input"
      />
    </div>

    <button type="submit" class="btn primary-btn" [disabled]="!forgetForm.form.valid">發送重置連結</button>
  </form>

  <div class="form-footer">
    想起密碼了？ <a routerLink="../login" class="text-link accent">返回登入</a>
  </div>
</div>
