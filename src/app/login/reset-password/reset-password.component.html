<div class="form-box">
  <div class="brand-logo">
    <span class="logo-icon">💠</span>
    <span>系統管理後台</span>
  </div>
  <h2>重設密碼</h2>
  <p class="subtitle">請輸入您的新密碼</p>

  <form (ngSubmit)="ResetPassword()" #resetForm="ngForm" class="auth-form">
    <div class="input-group">
      <input
        type="password"
        placeholder="新密碼 (最少8字元)"
        required
        minlength="8"
        [(ngModel)]="newPassword"
        name="newPassword"
        class="glass-input"
      />
    </div>

    <div class="input-group" style="margin-bottom: 30px;">
      <input
        type="password"
        placeholder="確認新密碼"
        required
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        class="glass-input"
      />
    </div>

    <button type="submit" class="btn primary-btn" [disabled]="!resetForm.form.valid">儲存新密碼</button>
  </form>

  <div class="form-footer">
    <a routerLink="../login" class="text-link accent">返回登入</a>
  </div>
</div>
